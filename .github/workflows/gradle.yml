name: Spring Boot Blue-Green Deployme
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: alhajcse/ci_cdpipeline:latest

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull alhajcse/ci_cdpipeline:latest

            ACTIVE=$(docker ps --filter "name=app-green" --format "{{.Names}}")
            if [ "$ACTIVE" == "app-green" ]; then
              NEW="app-blue"
              OLD="app-green"
              NEW_PORT=8082
            else
              NEW="app-green"
              OLD="app-blue"
              NEW_PORT=8081
            fi

            echo "Launching new container: $NEW on port $NEW_PORT"
            docker run -d --name "$NEW" -p "$NEW_PORT":8083 alhajcse/ci_cdpipeline:latest

            echo "Waiting for Spring Boot to start..."

            for i in {1..24}; do
              echo "Health check attempt $i..."
              if curl --fail http://localhost:$NEW_PORT/actuator/health; then
                echo "✅ Health check passed."
                break
              fi
              sleep 5
            done

            if ! curl --fail http://localhost:$NEW_PORT/actuator/health; then
              echo "❌ Health check failed! Removing $NEW."
              docker rm -f "$NEW"
              exit 1
            fi

            echo "✅ Health check passed. Updating NGINX config..."
            sed -i "s|proxy_pass http://localhost:[0-9]*;|proxy_pass http://localhost:$NEW_PORT;|" /etc/nginx/conf.d/default.conf
            nginx -s reload

            # Remove old container only
            docker rm -f $OLD || true

